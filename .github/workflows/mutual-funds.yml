name: Update mutual funds data

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 08:00 UTC = 09:00 Lagos, weekdays only
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch mutual funds data
        run: npx tsx scripts/fetch-mutual-funds.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mutual-funds/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            PERIOD=$(node -e "const d=JSON.parse(require('fs').readFileSync('public/data/mutual-funds/latest.json','utf8')); console.log(d.quality.lastReportingDate)")
            git commit -m "data: update mutual funds data to ${PERIOD}

Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01LA3FD85KUhMiNytmQ7FrFH"
            git push
          fi