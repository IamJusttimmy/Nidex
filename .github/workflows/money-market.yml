name: Update money market data

on:
  schedule:
    # Runs daily at 08:00 UTC (09:00 Lagos time).
    # CBN updates monthly, so daily is sufficient to catch new publications promptly.
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=verbose

      - name: Fetch money market data
        run: node scripts/fetch-money-market.mjs

      - name: Commit and push if changed
        run: |
          git config user.name  "nidex-bot"
          git config user.email "nidex-bot@users.noreply.github.com"
          git add public/data/money-market/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            PERIOD=$(node -e "const d=require('./public/data/money-market/latest.json');console.log(d.coverage.lastPeriod)")
            git commit -m "data: update money market data to ${PERIOD}"
            git push
          fi